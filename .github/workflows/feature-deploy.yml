# Trigger a Vercel deployment on demand. Vercel builds remotely — nothing is built in CI.
#
# Required GitHub repository secrets:
#   VERCEL_TOKEN        - https://vercel.com/account/tokens
#   VERCEL_ORG_ID       - Team ID from Vercel → Project → Settings (or .vercel/project.json)
#   VERCEL_PROJECT_ID   - Project ID from the same place
#
# Usage: GitHub → Actions → Feature Environment Deploy → choose branch → Run workflow

name: Feature Environment Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: feature-deploy-${{ github.ref_name }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      environment: ${{ inputs.environment }}
      branch: ${{ github.ref_name }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  output-url:
    name: Output deployment URL
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Print deployment URL
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          DEPLOY_ENV: ${{ needs.deploy.outputs.environment }}
          DEPLOY_BRANCH: ${{ needs.deploy.outputs.branch }}
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            label="Production URL"
          else
            label="Preview URL"
          fi

          echo "$label: $DEPLOY_URL"
          echo "DEPLOYMENT_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

          {
            echo "### $label"
            echo ""
            echo "**[$DEPLOY_URL]($DEPLOY_URL)**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | \`$DEPLOY_BRANCH\` |"
            echo "| **Environment** | \`$DEPLOY_ENV\` |"
            echo "| **URL** | $DEPLOY_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set job output
        id: url
        run: echo "url=${{ needs.deploy.outputs.url }}" >> "$GITHUB_OUTPUT"
